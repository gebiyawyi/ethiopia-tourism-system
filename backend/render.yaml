# render.yaml
services:
  - type: web
    name: ethiopia-tourism-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: EMAIL_USER
        value: gebiyaw2004@gmail.com
      - key: EMAIL_PASSWORD
        value: your_app_password_here
      - key: JWT_SECRET
        value: your_jwt_secret_here
      - key: DB_HOST
        value: your_db_host
      - key: DB_USER
        value: your_db_user
      - key: DB_PASSWORD
        value: your_db_password
      - key: DB_NAME
        value: tourism_db